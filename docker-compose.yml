services:
  dashboard:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "4000"
      WEB_ROOT: /app/web
      # Same origin as the published port. Override with the public https URL on a host.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
